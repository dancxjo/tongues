[graph]
all-features = true

[advisories]
# Keep this list aligned with .cargo/audit.toml. Every entry must have an
# owner, rationale, and expiry/review date in docs/dependencies.md.
unmaintained = "workspace"
unsound = "none"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-4-Clause",
    "BSL-1.0",
    "CC-BY-SA-4.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
# This graph legitimately contains parallel major versions from native/model
# stacks. Keep them visible, and promote costly or security-sensitive cases to
# targeted deny-multiple-versions rules as they are identified.
multiple-versions = "warn"
wildcards = "warn"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
required-git-spec = "rev"
