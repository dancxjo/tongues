[workspace]
members = [
    "crates/tongues-core",
    "crates/tongues-audio",
    "crates/tongues-data",
    "crates/tongues-neural",
    "crates/tongues-g2p2g",
    "crates/tongues-emotions",
    "crates/tongues-common-phone",
    "crates/tongues-interpretation",
    "crates/tongues-sentence-parser",
    "crates/tongues-wiktionary",
    "crates/tongues-tts",
    "crates/tongues-head2phones",
    "crates/tongues-duplex",
    "crates/tongues-cli",
    "crates/speaking",
    "crates/styletts2",
    "xtask", "crates/tongues-server",
]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
burn = { version = "0.21", features = ["ndarray", "autodiff"] }
burn-cuda = { version = "0.21", default-features = false, features = ["std", "fusion"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
anyhow = "1"
thiserror = "1"
dirs = "6"
hound = "3"
rustfft = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
cpal = "0.15"
inquire = "0.9.4"
owo-colors = "4"
indicatif = "0.17"
textplots = "0.8"
toml = "0.8"
bzip2 = "0.4"
unicode-normalization = "0.1"
unicode-segmentation = "1"
isolang = { version = "2.4", features = ["english_names"] }
langtag = "1.1"
walkdir = "2"
whisper-cpp-plus = { version = "0.1.4", default-features = false }
