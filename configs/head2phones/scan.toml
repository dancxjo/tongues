dataset_id = "scan"
varieties = ["en-US"]
source_paths = []
include_synthetic = true
include_default_gutenberg = false
gutenberg_urls = []
synthetic_buffers = 64
random_cuts_per_buffer = 8
no_head_cuts_per_head = 8
include_exceptional = true
include_naive_seams_discrepancies = true
max_naive_seams_discrepancies_per_file = 128
train_frac = 0.8
valid_frac = 0.1
seed = 42
min_head_graphemes = 4
max_head_graphemes = 220

# Passive scan mode: ask a local Ollama model to audit a bounded sample and
# write ollama_verification.json, but do not fail unless strict is enabled.
verify_with_ollama = true
ollama_url = "http://localhost:11434"
ollama_model = "gemma4:latest"
ollama_verify_rows = 32
ollama_verify_max_chars = 12000
ollama_verify_strict = false
