dataset_id = "enwiktionary-2026-06-01-v0"
dump_index_url = "https://dumps.wikimedia.org/other/mediawiki_content_current/enwiktionary/2026-06-01/xml/bzip2/"
train_frac = 0.8
valid_frac = 0.1
seed = 777
languages = ["eng", "fra", "deu", "spa", "lat", "ell", "grc", "san"]

# Train all pronunciation tasks generated by this config:
# - orthography -> phonemes/phones
# - phonemes/phones -> orthography
# - phonemes -> phones when matched source rows are available
# - orthography -> language
# - phonology/phonetics -> language
# - orthography + phonology/phonetics -> language
train_task = "all"

# Include slash-delimited phonemic rows from phonemes.jsonl and
# bracket-delimited phonetic rows from phones.jsonl.
train_notations = ["phonemic", "phonetic"]
include_reverse = true
include_language_guessing = true

# Add Castilian and standard Latin American Spanish phonemic rows from Spanish
# page titles by applying regular Spanish orthography-to-phoneme rules.
synthesize_spanish = true

# Collate selected Wiktionary domains into supplemental_terms.jsonl and duplicate
# any matching pronunciation rows with domain variety tags for training:
# - English Greek-derived names
# - Latin
# - neo-Latin/scientific names
# - legal Latin
include_wiktionary_supplements = true

# Add a small pinned English cleanup corpus for high-frequency pronunciation
# traps: core function words, hyphenated compounds, letter/word/phoneme tags,
# known spelling-pronunciation hallucinations, dialect-tagged variants, and
# broad-vs-narrow phonetic equivalences.
include_cleanup_corpus = true

# Passive sanity scan with a local Ollama server during prepare. This runs after
# train.jsonl exists, including prepare runs that reuse parsed/expanded data.
verify_with_ollama = true
ollama_url = "http://localhost:11434"
ollama_model = "gpt-oss:20b"
ollama_verify_rows = 32
ollama_verify_max_chars = 12000
ollama_verify_strict = false

# Set this to avoid scanning the dump index, or to pin a specific dump file.
# dump_file_url = "https://dumps.wikimedia.org/other/mediawiki_content_current/enwiktionary/2026-06-01/xml/bzip2/enwiktionary-2026-06-01-p6p11719661.xml.bz2"

