[package]
name = "tongues-cli"
version = "0.1.0"
license.workspace = true
edition = "2021"

[[bin]]
name = "tongues"
path = "src/main.rs"

[dependencies]
tongues-core = { path = "../tongues-core" }
tongues-audio = { path = "../tongues-audio" }
tongues-common-phone = { path = "../tongues-common-phone" }
tongues-data = { path = "../tongues-data" }
tongues-g2p2g = { path = "../tongues-g2p2g" }
tongues-emotions = { path = "../tongues-emotions" }
tongues-head2phones = { path = "../tongues-head2phones" }
tongues-duplex = { path = "../tongues-duplex" }
tongues-interpretation = { path = "../tongues-interpretation" }
tongues-neural = { path = "../tongues-neural" }
tongues-sentence-boundary = { path = "../tongues-sentence-boundary" }
tongues-tts = { path = "../tongues-tts", default-features = false }
tongues-wiktionary = { path = "../tongues-wiktionary" }
burn = { workspace = true }
burn-cuda = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
rand = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
hound = { workspace = true }
sha2 = { workspace = true }
cpal = { workspace = true }
inquire = { workspace = true }
owo-colors = { workspace = true }
speaking = { path = "../speaking", features = ["asr-whisper"] }
styletts2 = { path = "../styletts2" }
indicatif = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
open-english-pronouncing-dictionary = "0.1.0"
seams = "0.1.2"

[build-dependencies]
serde_json = { workspace = true }

[features]
default = ["styletts2-onnx", "onnx-tts"]
styletts2-onnx = ["styletts2/styletts2-onnx"]
onnx-tts = ["tongues-tts/onnx-tts"]
