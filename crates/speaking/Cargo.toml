[package]
name = "speaking"
version = "0.1.0"
license.workspace = true
edition = "2024"
description = "Backend-free linguistic and acoustic speaking ontology"

[dependencies]
anyhow = { workspace = true }
arpabet_cmudict = { version = "=2.0.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
dirs = "6"
isolang = { workspace = true }
langtag = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
whisper-cpp-plus = { workspace = true, optional = true }

[features]
default = ["embedded-cmudict"]
embedded-cmudict = ["dep:arpabet_cmudict"]
asr-whisper = ["dep:whisper-cpp-plus"]
link-grammar-oracle = []
