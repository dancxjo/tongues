[package]
name = "speaking"
version = "0.1.0"
edition = "2024"
description = "Backend-free linguistic and acoustic speaking ontology"

[lints.rust]
warnings = "allow"

[dependencies]
anyhow = { workspace = true }
arpabet_cmudict = "=2.0.0"
serde = { version = "1", features = ["derive"] }
dirs = "6"
isolang = { workspace = true }
langtag = { workspace = true }
whisper-cpp-plus = { workspace = true, optional = true }

[features]
default = []
asr-whisper = ["dep:whisper-cpp-plus"]

[dev-dependencies]
serde_json = { workspace = true }
