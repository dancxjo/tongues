[package]
name = "tongues-server"
version = "0.1.0"
license.workspace = true
edition = "2024"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.0"
burn.workspace = true
burn-cuda.workspace = true
clap.workspace = true
dirs.workspace = true
futures-util = "0.3"
hound.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23.40", features = ["aws-lc-rs"] }
speaking = { version = "0.1.0", path = "../speaking", features = ["asr-whisper"] }
styletts2 = { version = "0.1.0", path = "../styletts2" }
tongues-audio = { version = "0.1.0", path = "../tongues-audio" }
tongues-duplex = { version = "0.1.0", path = "../tongues-duplex" }
tongues-pipeline = { version = "0.1.0", path = "../tongues-pipeline" }
tongues-cli = { version = "0.1.0", path = "../tongues-cli" }
tongues-tts = { version = "0.1.0", path = "../tongues-tts" }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
uuid = { version = "1.23.3", features = ["v4"] }
