<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WaveDeck · Tongues</title>
  <style>
    :root{color-scheme:dark;--bg:#11151b;--panel:#1b222c;--line:#364354;--ink:#edf4ff;--muted:#9aacbf;--accent:#7bd9c8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
    header,main{max-width:1200px;margin:auto;padding:1rem}header{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
    a{color:var(--accent)}button,.file{border:1px solid var(--line);border-radius:.5rem;background:var(--panel);color:var(--ink);padding:.55rem .75rem}
    button:focus,.file:focus-within{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.4}
    .toolbar{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.file input{max-width:14rem}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.lane{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:1rem}
    .spans{display:grid;gap:.45rem}.span{text-align:left;display:grid;gap:.2rem;width:100%}.span small{color:var(--muted)}
    .span.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.span-word{margin-left:1.5rem;width:calc(100% - 1.5rem)}
    #status{min-height:1.5rem;color:var(--accent)}@media(max-width:700px){.compare{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <a href="/speech/compose">← Speech Studio</a>
    <div><h1>WaveDeck</h1><p>Inspect → correct → align → annotate → edit → replay → export</p></div>
  </header>
  <main>
    <section aria-labelledby="session-heading">
      <h2 id="session-heading"><span id="session-name">No session</span></h2>
      <p id="operation-count">0 replayable operations</p>
      <div class="toolbar">
        <label class="file">Open session JSON <input id="open-file" type="file" accept="application/json"></label>
        <button id="start-live">Start live microphone</button><button id="stop-live" disabled>Stop live</button>
      </div>
      <div class="toolbar" aria-label="Timeline editing">
        <button id="replace" data-needs-session>Edit text (E)</button><button id="annotate" data-needs-session>Annotate</button>
        <button id="start-earlier" data-needs-session>Start −10 ms ([)</button><button id="start-later" data-needs-session>Start +10 ms</button>
        <button id="end-earlier" data-needs-session>End −10 ms</button><button id="end-later" data-needs-session>End +10 ms (])</button>
        <button id="undo" data-needs-session>Undo</button><button id="redo" data-needs-session>Redo</button>
      </div>
      <div class="toolbar" aria-label="Independent exports">
        <button data-export="evidence" data-needs-session>Raw evidence</button>
        <button data-export="corrected" data-needs-session>Corrected transcript</button>
        <button data-export="operations" data-needs-session>Edit log</button>
        <button data-export="bundle" data-needs-session>Complete bundle</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section class="compare" aria-label="Original and edited projections">
      <article class="lane"><h2>Original observed evidence</h2><div id="original" class="spans"></div></article>
      <article class="lane"><h2>Edited interpretation</h2><div id="edited" class="spans"></div></article>
    </section>
  </main>
  <script type="module" src="/wavedeck.js"></script>
</body>
</html>
