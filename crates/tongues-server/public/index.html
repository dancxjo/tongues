<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tongues / PETE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="container">
        <header>
            <h1>Tongues <span>Laboratory</span></h1>
            <p>State-of-the-art TTS testing & Emotion Signatures</p>
        </header>

        <main class="glass-panel">
            <form id="synth-form">
                <div class="form-group">
                    <label for="text">Prompt</label>
                    <textarea id="text" placeholder="Type something for PETE to say..." required>Wow, the magic wand actually worked!</textarea>
                </div>
                
                <div class="controls-grid">
                    <div class="form-group">
                        <label for="emotion">Emotion Signature</label>
                        <select id="emotion">
                            <option value="">None (Neutral)</option>
                        </select>
                        <div id="emotion-detail" class="emotion-detail">No emotion signature selected</div>
                    </div>

                    <div class="form-group">
                        <label for="emotion_strength">Emotion Strength (<span id="strength-val">0.75</span>)</label>
                        <input type="range" id="emotion_strength" min="0.0" max="2.0" step="0.05" value="0.75">
                        <div id="strength-presets" class="strength-presets">
                            <button type="button" data-preset="subtle">Subtle</button>
                            <button type="button" data-preset="normal">Normal</button>
                            <button type="button" data-preset="strong">Strong</button>
                        </div>
                    </div>
                </div>

                <div class="action-bar">
                    <button type="submit" id="submit-btn">
                        <span class="btn-text">Generate Speech</span>
                        <div class="spinner" id="spinner"></div>
                    </button>
                </div>
            </form>

            <div id="result-container" class="hidden">
                <div class="audio-wrapper">
                    <p class="result-label">Result Audio</p>
                    <audio id="audio-player" controls></audio>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
