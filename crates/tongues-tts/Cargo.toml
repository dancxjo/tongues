[package]
name = "tongues-tts"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
burn = { workspace = true }
burn-store = { version = "0.21", default-features = false, features = ["std", "pytorch", "safetensors"] }
dirs = { workspace = true }
json5 = "0.4"
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls", "api-23"] }
safetensors = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
speaking = { path = "../speaking" }
thiserror = { workspace = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tongues-core = { path = "../tongues-core" }
tongues-audio = { path = "../tongues-audio" }
tongues-g2p2g = { path = "../tongues-g2p2g" }
tongues-wiktionary = { path = "../tongues-wiktionary" }
ureq = { workspace = true }
zip = { workspace = true }

[features]
default = ["onnx-tts"]
onnx-tts = ["dep:ort", "ort/cuda"]

[dev-dependencies]
tempfile = "3"
