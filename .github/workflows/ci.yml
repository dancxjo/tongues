name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check

  clippy-workspace:
    name: Clippy workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Lint default, no-default, and all-feature workspaces
        run: scripts/clippy-feature-matrix.sh workspace

  clippy-powerset:
    name: Clippy package feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Lint supported package feature combinations
        run: scripts/clippy-feature-matrix.sh powerset

  workspace:
    name: Workspace checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Prove lexical assets build offline
        run: |
          cargo fetch --locked
          CARGO_NET_OFFLINE=true cargo check -p speaking --locked
          python3 scripts/check-linguistic-assets.py
      - name: Check repository scripts
        run: bash -n scripts/check-feature-matrix.sh scripts/clippy-feature-matrix.sh scripts/speech-smoke.sh scripts/speech-conformance.sh
      - name: Check default, no-default, and all-feature workspaces
        run: scripts/check-feature-matrix.sh workspace
      - name: Build the speech CLI in release mode
        run: cargo build --release -p tongues-cli --locked
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast --locked
      - name: Check server UI JavaScript
        run: |
          node --check crates/tongues-server/public/app.js
          node --check crates/tongues-server/public/speech-studio.js
          node --test crates/tongues-server/public/speech-studio.test.cjs

  feature-powerset:
    name: Package feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check every declared package feature combination
        run: scripts/check-feature-matrix.sh powerset
